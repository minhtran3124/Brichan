name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c "import re; from pathlib import Path; text = Path('pyproject.toml').read_text(encoding='utf-8'); print(re.search(r'^version = \"([^\"]+)\"$', text, re.MULTILINE).group(1))")"
          test "$RELEASE_TAG" = "v$VERSION"

      - name: Build sdist and wheel
        run: python -m build --outdir dist .

      - name: Validate metadata and README with twine
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brichan-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Requires a "pypi" GitHub Environment configured with a PyPI Trusted
    # Publisher for this repository/workflow before this job can succeed.
    # See projects/brida-installable-tool/handoffs/PYPI-001/release-checklist.md.
    environment:
      name: pypi
      url: https://pypi.org/project/brichan/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: brichan-dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
