name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build backend for no-build-isolation builds
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Run repository checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: make check

  package:
    name: Package Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build --outdir dist .

      - name: Validate metadata and README with twine
        run: python -m twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/brichan-venv
          /tmp/brichan-venv/bin/python -m pip install --no-deps dist/*.whl

      - name: Smoke every installed command without external providers
        run: |
          BIN=/tmp/brichan-venv/bin
          "$BIN/python" -c "import brichan; print(brichan.__version__)"
          "$BIN/brichan" --help
          "$BIN/brichan" --version
          "$BIN/brichan-herdr-agent-start" --help
          "$BIN/brichan-validate-receipts" projects
          # brichan-codex and brichan-claude are checkout-oriented: from inside a
          # Brichan checkout they resolve routing and hand off to the provider,
          # which is not installed here. Their documented no-provider contract
          # is the outside-a-checkout path, so smoke them from somewhere else.
          ( cd /tmp && unset BRICHAN_ROOT \
            && "$BIN/brichan-codex" --help \
            && "$BIN/brichan-codex" --version \
            && "$BIN/brichan-claude" --help \
            && "$BIN/brichan-claude" --version )
          mkdir /tmp/brichan-smoke-project
          git init --quiet /tmp/brichan-smoke-project
          "$BIN/brichan" init --project /tmp/brichan-smoke-project
          "$BIN/brichan" init --apply --project /tmp/brichan-smoke-project
          "$BIN/brichan" status --project /tmp/brichan-smoke-project
          "$BIN/brichan" doctor --project /tmp/brichan-smoke-project || true

      - name: Verify source imports
        run: make package-check
